<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ed">
  <title>Draw What I'm Thinking 🎨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Return to home"><span class="brand-mark">✦</span><span>Draw What I’m Thinking</span></button>
      <div class="top-actions"><span class="connection" id="connectionStatus">Connecting...</span><button class="icon-button" id="muteButton" title="Mute sound" aria-label="Mute sound">🔊</button><button class="icon-button" id="voiceSettingsTop" title="Voice settings" aria-label="Voice settings">⚙️</button></div>
    </header>
    <main id="app" class="app-main"></main>
    <aside class="voice-dock" id="voiceDock" aria-label="Voice chat controls" hidden>
      <button class="voice-control" id="micButton" title="Toggle microphone">🎤 <span>Mic On</span></button>
      <button class="voice-control" id="muteEveryoneButton" title="Mute other players locally">🔊 <span>Voice</span></button>
      <button class="voice-control" id="voiceSettingsButton" title="Voice settings">⚙️ <span>Settings</span></button>
      <button class="push-to-talk" id="pushToTalkButton" hidden>🎤 HOLD TO TALK</button>
    </aside>
    <dialog id="voiceSettingsDialog" class="voice-dialog">
      <form method="dialog" id="voiceSettingsForm"><div class="panel-head"><div><div class="step-label">Voice settings</div><h2>Sound check</h2></div><button class="icon-button" value="cancel" aria-label="Close settings">×</button></div>
        <label class="field-label">🎤 Microphone<select id="microphoneSelect"><option value="default">Default microphone</option></select></label>
        <label class="field-label">🔊 Speaker<select id="speakerSelect"><option value="default">Default speaker</option></select></label>
        <label class="field-label">🎚️ Microphone level<input id="micVolume" type="range" min="0" max="1" step=".05" value="1"></label>
        <label class="field-label">🔊 Voice volume<input id="voiceVolume" type="range" min="0" max="1" step=".05" value="1"></label>
        <label class="toggle-row"><input id="pushToTalkToggle" type="checkbox"> Push-to-talk</label>
        <div class="mic-meter"><span id="micMeterFill"></span></div><p class="muted-copy" id="micPermissionMessage">Your microphone stays local and is never recorded.</p>
        <div class="form-actions"><button class="btn btn-soft" type="button" id="testMicButton">🎙️ Test microphone</button><button class="btn btn-primary" value="save">Save settings</button></div>
      </form>
    </dialog>
    <div id="remoteAudio" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="/runtime-config.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
  <script src="/voice.js"></script>
</body>
</html>
